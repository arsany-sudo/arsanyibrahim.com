                  const body = x.body;
                  if (body.length > LINE_MAX) { lineProblem = `has a changed line over ${LINE_MAX} characters`; break; }
                  const bad = anyRe(rules_.map((d) => d.re), body);
                  if (bad) { lineProblem = `adds or removes a protected line (rule: ${rules_.find((d) => d.re === bad).source})`; break; }
                  const sq = squashed.find((w) => squash(body).includes(w));
                  if (sq) { lineProblem = `adds or removes a protected word (${sq})`; break; }
                  const b2 = anyRe(builtIn, body);
                  if (b2) { lineProblem = `adds or removes code, markup, a redirect or an indexing rule (built-in: ${b2.source.slice(0, 40)})`; break; }
                  if (x.sign === '+') { const pl = protectedLink(body, prot, hosts); if (pl) { lineProblem = `links to a protected path (${pl.slice(0, 60)})`; break; } }
                  // Every file the fix lane can merge: URLs must stay on hosts (new posts are checked below).
                  if (!addOnly) { const u = urlProblem(body, hosts); if (u) { lineProblem = `has ${u}`; break; } }
                  if (health && !addOnly) {
                    if (HEADING.test(body) || folds(body).some((v) => HEADING.test(v))) { lineProblem = 'changes a heading line, which never auto-merges on a health site'; break; }
                  }
                }
                if (!lineProblem && health && !addOnly) { const w = addedPriceWord(changed); if (w) lineProblem = `adds the price or offer word "${w}", which never auto-merges on a health site`; }
                if (lineProblem) { reasons.push(`\`${name0}\` ${lineProblem}`); continue; }
                if (!addOnly) {
                  let baseLines = null;
                  if (typeof f.baseText === 'string') baseLines = f.baseText.split('\n');
                  const problem = shapeProblem(P, name0, { health, baseLines, chains, prot, code });
                  if (problem) reasons.push(`\`${name0}\` ${problem}`);
                }
                if (future && hitAnyCase(name0, future.files)) {
                  if (f.status !== 'added') reasons.push(`\`${name0}\` is not a new post, so its publish date cannot be checked`);
                  else {
                    const p = postDateProblem(P, future.fields[0], today); if (p) reasons.push(`\`${name0}\` ${p}`);
                    const b = blogPostProblem(P, name0, rules.frontmatter, hosts, f.siblings); if (b) reasons.push(`\`${name0}\` ${b}`);
                  }
                }
              }
              return [...new Set(reasons)];
            }
            const LINE_MAX = 2000;
            // Health lanes: a heading line never merges, whatever shape it has.
            const HEADING = /<\s*h[1-6]\b|^\s*#{1,6}(\s|$)|\b(h[1-6]|heading|headline|subheading|subhead|eyebrow|kicker|hero)\s*\??\s*[:=]|Heading\b|^\s*={3,}\s*$|^\s*-{3,}\s*$/i;
            // Health fix lanes: price and offer words in an added line hold (removing one is fine).
            const HEALTH_ADDED = /\b(price[sd]?|pricing|costs?|costing|cheap(er|est)?|affordable|discount(s|ed)?|deals?|sale|coupons?|promo(s|tion|tions)?|promo-?code|savings?|save|bargain|lowest|free)\b/gi;
            // Each price word a file's added lines carry more often than its removed lines.
            const addedPriceWord = (changed) => {
              const n = new Map();
              for (const x of changed) for (const m of fold(x.body).matchAll(HEALTH_ADDED)) { const w = m[1].toLowerCase(); n.set(w, (n.get(w) || 0) + (x.sign === '+' ? 1 : -1)); }
              for (const [w, c] of n) if (c > 0) return w;
              return null;
            };
            // END RULES LOGIC

            const { owner, repo } = context.repo;
            const base = context.payload.repository.default_branch;
            const sha = context.eventName === 'pull_request_target' ? context.payload.pull_request.head.sha : context.payload.sha;
            const MARK = '<!-- seo-automerge -->';

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base, per_page: 100 });
            const pr = prs.find((p) => p.head.sha === sha && p.head.repo && p.head.repo.full_name === `${owner}/${repo}` && !p.draft);
            if (!pr) { core.info('No open same-repo pull request for this commit.'); return; }

            const kind = pr.head.ref.startsWith('fix/seo-') ? 'fix' : pr.head.ref.startsWith('blog/') ? 'blog' : null;
            if (!kind) { core.info(`Branch ${pr.head.ref} is not an agent SEO branch.`); return; }

            // On either trigger, go on only if every Vercel status on this exact commit is
            // already success (newest status per context wins).
            const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, { owner, repo, ref: sha, per_page: 100 });
            const latest = new Map();
            for (const s of statuses) if (!latest.has(s.context)) latest.set(s.context, s.state);
            const vercel = [...latest].filter(([c]) => c.startsWith('Vercel'));
            if (!vercel.length || vercel.some(([, state]) => state !== 'success')) {
              core.info(`Vercel is not green yet for ${sha}: ${JSON.stringify(vercel)}. A later status event will run this again.`);
              return;
            }

            const cfgFile = await github.rest.repos.getContent({ owner, repo, path: '.github/seo-automerge.json', ref: base });
            // A rule file that does not parse holds every pull request (evaluate gets no rules).
            let cfg = null;
            try { cfg = JSON.parse(Buffer.from(cfgFile.data.content, 'base64').toString('utf8')); } catch (e) { core.warning('.github/seo-automerge.json is not valid JSON'); }
            const lane = cfg && typeof cfg === 'object' ? cfg[kind] : null;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            // Modified files the lane allows are read at the merge base (the commit the patch was
            // computed against): frontmatter, alt and data-block checks need the whole file. If one
            // cannot be read, its lines are judged from the patch alone, which holds more.
            if (files.some((f) => needsBase(lane, f))) {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${base}...${sha}` });
              const mb = cmp.data.merge_base_commit.sha;
              for (const f of files) {
                if (!needsBase(lane, f)) continue;
                try {
                  const c = await github.rest.repos.getContent({ owner, repo, path: f.filename, ref: mb });
                  if (c.data && c.data.encoding === 'base64') f.baseText = Buffer.from(c.data.content, 'base64').toString('utf8');
                } catch (e) { core.info(`Could not read ${f.filename} at ${mb}.`); }
              }
            }
            // A new blog post must not reuse a slug: list the posts on the default branch and read
            // each one's slug. If the list cannot be read, the post is held (no siblings).
            const dirs = [...new Set(files.map((f) => siblingDir(lane, f)).filter(Boolean))];
            for (const dir of dirs) {
              try {
                const list = await github.rest.repos.getContent({ owner, repo, path: dir, ref: base });
                if (!Array.isArray(list.data)) continue;
                const sib = [];
                for (const e of list.data) {
                  if (e.type !== 'file') { sib.push({ name: e.name, slug: e.name.toLowerCase() }); continue; }
                  if (!/\.mdx?$/i.test(e.name)) { sib.push({ name: e.name, slug: null }); continue; }
                  const c = await github.rest.repos.getContent({ owner, repo, path: e.path, ref: base });
                  const text = Buffer.from(c.data.content, 'base64').toString('utf8');
                  sib.push({ name: e.name, slug: slugOf(text, (lane.frontmatter && lane.frontmatter.slugKey) || 'slug') });
                }
                for (const f of files) if (siblingDir(lane, f) === dir) f.siblings = sib;
              } catch (e) { core.info(`Could not list ${dir} on ${base}.`); }
            }
            const reasons = evaluate(kind, lane, files, todayInLA());

            const full = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            if (full.head.sha !== sha) { core.info('The pull request moved to a newer commit; that commit gets its own run.'); return; }
            if (full.mergeable === false) reasons.push('the branch has conflicts with ' + base);

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const said = (text) => comments.some((c) => c.body && c.body.includes(MARK) && c.body.includes(text));

            if (reasons.length) {
              const body = `${MARK}\nHeld for a person. Not auto-merged because:\n- ${[...new Set(reasons)].join('\n- ')}`;
              if (!said(body)) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              core.notice(`PR #${pr.number} held: ${reasons.length} reason(s).`);
              return;
            }

            await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, sha, merge_method: 'squash' });
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
              body: `${MARK}\nAuto-merged: Vercel build passed and all ${files.length} changed file(s) are inside the ${kind} rules.` });
            core.notice(`PR #${pr.number} merged.`);
