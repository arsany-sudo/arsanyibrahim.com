name: SEO auto-merge

# Merges agent pull requests from fix/seo-* and blog/* branches once the Vercel
# build for the pull request passes AND every changed file is inside the rules in
# .github/seo-automerge.json (read from the default branch, never from the PR).
# This workflow never checks out or runs pull request code. Both triggers run the
# copy of this file on the default branch:
# - status: the Vercel commit status turns green.
# - pull_request_target: the pull request is opened, reopened or updated. This
#   covers the race where Vercel reports success before the pull request exists.
#   It only reads the commit statuses that are already there and goes on only if
#   every Vercel status for the head commit is already success.
# Never change this to plain pull_request: that would run the workflow file from
# the pull request branch with a write token.
# Anything outside the rules stays open with a comment that says why.

on:
  status:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: seo-automerge-${{ github.event.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'status' && github.event.state == 'success' && startsWith(github.event.context, 'Vercel')) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // BEGIN RULES LOGIC (pure functions; the test harness extracts and runs this block)
            // Never auto-merged, whatever the rules file says. Matched without regard to case.
            const HARD_DENY = [
              '.github/**', '.claude/**', '**/.*', '**/.*/**', '.env*', '**/.env*',
              '**/package.json', '**/package-lock.json', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/*.lock',
              '**/*.config.*', '**/tsconfig*.json', '**/vercel.json', '**/netlify.toml', '**/Dockerfile', '**/Makefile',
              '**/middleware.*', '**/proxy.*', '**/instrumentation*', '**/route.*', '**/robots.*', '**/_headers', '**/_redirects',
              '**/api/**', '**/actions/**', '**/actions.*', '**/*.server.*',
              'src/pages/**/*.ts', 'src/pages/**/*.js', 'src/pages/**/*.mts', 'src/pages/**/*.mjs',
              '**/*.html', '**/*.htm', '**/*.php', '**/*.sh', 'public/**/*.js', 'public/**/*.mjs', 'public/**/*.cjs',
              'supabase/**', 'prisma/**', 'drizzle/**', 'migrations/**', 'scripts/**',
            ];

            // Glob to regular expression. "**/" is zero or more folders, "**" anything,
            // "*" anything inside one folder. Every other character is literal.
            const toRe = (glob, flags = '') => {
              let re = '';
              for (let i = 0; i < glob.length;) {
                if (glob.startsWith('**/', i)) { re += '(?:.*/)?'; i += 3; }
                else if (glob.startsWith('**', i)) { re += '.*'; i += 2; }
                else if (glob[i] === '*') { re += '[^/]*'; i += 1; }
                else { re += glob[i].replace(/[.+?^${}()|[\]\\]/g, '\\$&'); i += 1; }
              }
              return new RegExp('^' + re + '$', flags);
            };
            // allow and newFiles are case-sensitive (narrow); deny, linkOnly and the rest are not (wide).
            const hit = (file, globs, flags = '') => (globs || []).some((g) => toRe(g, flags).test(file));
            const hitAnyCase = (file, globs) => hit(file, globs, 'i');

            // fold: a copy of a line with look-alike tricks undone, so every deny check sees the plain
            // letters: HTML entities, JS and JSON escapes and %xx are decoded, NFKD with combining marks
            // removed, invisible format characters (zero-width, soft hyphen, bidi) removed, and common
            // Cyrillic and Greek look-alikes mapped to Latin. Deny checks test the raw line and this copy.
            const CONF_FROM = '\u0430\u0432\u0435\u043a\u043c\u043d\u043e\u0440\u0441\u0442\u0443\u0445\u0456\u0458\u0455\u0501\u04cf\u0261\u0578\u057d\u0410\u0412\u0415\u041a\u041c\u041d\u041e\u0420\u0421\u0422\u0423\u0425\u0406\u0408\u0405\u03b1\u03b2\u03b5\u03b7\u03b9\u03ba\u03bd\u03bf\u03c1\u03c4\u03c5\u03c7\u03c9\u0391\u0392\u0395\u0396\u0397\u0399\u039a\u039c\u039d\u039f\u03a1\u03a4\u03a5\u03a7\u0131\u2113';
            const CONF_TO = 'abekmhopctyxijsdlgnuABEKMHOPCTYXIJSabeniknoptuxwABEZHIKMNOPTYXil';
            const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', shy: '', zwj: '', zwnj: '', zwsp: '', ZeroWidthSpace: '', NoBreak: '', percnt: '%', dollar: '$', excl: '!', sol: '/', colon: ':', period: '.', hyphen: '-', dash: '-', num: '#', mdash: '\u2014', ndash: '\u2013', lpar: '(', rpar: ')' };
            const cp = (n) => (n >= 0 && n <= 0x10ffff ? String.fromCodePoint(n) : '');
            const fold = (s) => {
              let t = s;
              for (let k = 0; k < 2; k++) {
                t = t.replace(/&#x([0-9a-f]{1,6});?/gi, (m, h) => cp(parseInt(h, 16)))
                  .replace(/&#(\d{1,7});?/g, (m, d) => cp(Number(d)))
                  .replace(/&([A-Za-z]+);/g, (m, n) => (Object.prototype.hasOwnProperty.call(ENT, n) ? ENT[n] : m))
                  .replace(/\\u\{([0-9a-f]{1,6})\}/gi, (m, h) => cp(parseInt(h, 16)))
                  .replace(/\\u([0-9a-f]{4})/gi, (m, h) => cp(parseInt(h, 16)))
                  .replace(/\\x([0-9a-f]{2})/gi, (m, h) => cp(parseInt(h, 16)))
                  .replace(/%([0-9a-f]{2})/gi, (m, h) => cp(parseInt(h, 16)))
                  .replace(/\\([^A-Za-z0-9])/g, '$1');
              }
              t = t.normalize('NFKD').replace(/\p{M}/gu, '').replace(/[\p{Cf}\u034f\u115f\u1160\u3164\uffa0\u180e\u2800]/gu, '');
              let out = '';
              for (const ch of t) { const i = CONF_FROM.indexOf(ch); out += i < 0 ? ch : CONF_TO[i]; }
              return out;
            };
            const squash = (s) => fold(s).toLowerCase().replace(/[^a-z0-9]/g, '');
            const anyRe = (res, line) => { const f = fold(line); return res.find((re) => re.test(line) || re.test(f)); };

            // Elements matched in any letter case in Markdown; in code only when the tag starts with a
            // lowercase letter (a capitalised tag such as <Base> or <Link> is a component, not this element).
            const BAD_TAGS = new Set(['script', 'iframe', 'object', 'embed', 'frame', 'frameset', 'applet', 'portal', 'base', 'meta', 'link', 'style', 'form', 'input', 'button', 'textarea', 'select', 'svg', 'math', 'template', 'noscript']);
            // Built-in line checks. CODE: every changed line of a file that is not Markdown. MARKUP: every
            // changed line of a Markdown file. They hold code capability, outside resources and deindexing.
            const CODE = [
              /process\s*(\.|\[)|import\.meta|\bfetch\s*\(|XMLHttpRequest|sendBeacon|\bimport\s*\(|^\s*import\b|^\s*export\s*[*{]|\brequire\s*\(|\beval\s*\(|\bFunction\s*\(|setTimeout|setInterval|WebSocket|EventSource|postMessage|localStorage|sessionStorage|\bdocument\s*\.|\bwindow\s*\.|globalThis|navigator\s*\.|dangerouslySetInnerHTML|innerHTML|outerHTML|use server|child_process|\bexecSync\b|\bspawn\s*\(/i,
              { source: 'an HTML element that loads or runs something', test: (s) => [...s.matchAll(/<\s*\/?\s*([A-Za-z][\w-]*)/g)].some((m) => /^[a-z]/.test(m[1]) && BAD_TAGS.has(m[1].toLowerCase())) },
              /\son[a-z]+\s*=|(java|vb|live)script\s*:|\bdata\s*:\s*[a-z]+\/|\bsrcdoc\b|\bformaction\b|http-equiv/i,
              /redirect|\blocation\s*(\.|=)|\bnoindex\b|\bnofollow\b|\bnoarchive\b|\bnosnippet\b|\bnoimageindex\b|unavailable_after|x-robots-tag|\bdisallow\b|\bindex\s*:\s*false|\bfollow\s*:\s*false|\bgooglebot\b|\bcanonical\b|\brobots\s*[:=]/i,
            ];
            const MARKUP = [
              /<\s*\/?\s*(script|iframe|object|embed|frame|frameset|applet|portal|base|meta|link|style|form|input|button|textarea|select|svg|math|template|noscript)\b|\son[a-z]+\s*=|(java|vb|live)script\s*:|\bdata\s*:\s*[a-z]+\/|\bsrcdoc\b|<!--|^\s*import\s+([\w*{}\s,]+\s+from\s+)?["']|^\s*export\s+(const|let|var|function|default|class|async)\b/i,
            ];
            // URLs in a changed line, found by scheme with or without slashes, with backslashes read as
            // slashes (browsers do), userinfo and ports removed, and protocol-relative //host forms. Returns
            // the first problem, or null. http(s), ftp(s) and ws(s) need a host on the lane's hosts list;
            // mailto needs its domain there; schemes that load or run something (data, javascript, blob,
            // file...) and any other scheme://, hold. linkHttps: an https URL to any host is fine (a cited
            // source link in a post's frontmatter).
            const RISKY_SCHEME = /(?<![A-Za-z0-9+.-])(javascript|vbscript|livescript|data|blob|file|filesystem|view-source|intent|jar|about|sms|smsto|mms|webcal|gopher|ssh|sftp|smb|chrome|android-app|ios-app|ms-[a-z-]+):(?=[A-Za-z0-9\/%.,;+_~-])/i;
            const urlProblem = (line, hosts, linkHttps = false) => {
              for (const v of [line, fold(line)]) {
                const s = v.replace(/\\/g, '/');
                const r = s.match(RISKY_SCHEME);
                if (r) return `a ${r[1].toLowerCase()}: URL`;
                for (const m of s.matchAll(/(?<![A-Za-z0-9+.-])(https?|ftps?|wss?):(\/*)([^\/\s"'`<>()?#\[\]{}|,;]*)/gi)) {
                  const host = m[3].replace(/^.*@/, '').replace(/:\d*$/, '').toLowerCase();
                  if (linkHttps && m[1].toLowerCase() === 'https' && m[2] === '//' && host && !m[3].includes('@')) continue;
                  if (!host || !hosts.has(host)) return `a URL host not on this repo's hosts list (${(host || m[0]).slice(0, 60)})`;
                }
                for (const m of s.matchAll(/(?<![A-Za-z0-9+.-])([A-Za-z][A-Za-z0-9+.-]*):\/\//g)) {
                  if (!/^(https?|ftps?|wss?)$/i.test(m[1])) return `a ${m[1].slice(0, 20)}:// URL`;
                }
                for (const m of s.matchAll(/(?<![:\w])\/\/+([^\/\s"'`<>()?#\[\]{}|,;]+)/g)) {
                  const host = m[1].replace(/^.*@/, '').replace(/:\d*$/, '').toLowerCase();
                  if (!hosts.has(host)) return `a protocol-relative URL to a host not on this repo's hosts list (${host.slice(0, 60)})`;
                }
                for (const m of s.matchAll(/(?<![A-Za-z0-9+.-])mailto:([^\s"'`<>()?#]*)/gi)) {
                  const host = m[1].replace(/^.*@/, '').toLowerCase();
                  if (!m[1].includes('@') || !hosts.has(host)) return `a mailto: address outside this repo's hosts list`;
                }
              }
              return null;
            };

            // Shared data files (not linkOnly): Next.js metadata and similar helpers name keys that can
            // deindex the site, claim ownership, load icons or redirect. A changed line that names one of
            // these keys, quoted or not, or sits inside a block opened by one, holds. Keys are compared in
            // lowercase with everything but letters and digits removed.
            const RESERVED_KEYS = new Set(['robots', 'index', 'follow', 'noindex', 'nofollow', 'googlebot', 'verification', 'alternates', 'canonical',
              'icons', 'icon', 'manifest', 'metadatabase', 'refresh', 'other', 'viewport', 'themecolor', 'applewebapp', 'applinks', 'archives', 'assets',
              'bookmarks', 'referrer', 'formatdetection', 'redirect', 'redirects', 'rewrites', 'headers', 'xrobotstag', 'nocache', 'noarchive', 'nosnippet',
              'noimageindex', 'notranslate', 'maxsnippet', 'maximagepreview', 'maxvideopreview', 'unavailableafter', 'googlesiteverification']);
            const reservedKey = (k) => RESERVED_KEYS.has(squash(k));
            // For each line of a JS, TS or JSON text: the keys of the blocks it sits in at its start, and the
            // keys it names. Strings, comments and template literals are skipped. null if the text does not
            // tokenize or its brackets do not balance (callers then hold).
            const keyContext = (text) => {
              const lines = text.split('\n');
              const out = []; const stack = [];
              let pending = [], mode = null, tplDepth = [];
              const keyAfter = (line, j) => { const m = line.slice(j).match(/^\s*\??\s*:(?!:)/); return !!m; };
              for (const line of lines) {
                const rec = { stack: stack.flat(), keys: [] };
                out.push(rec);
                for (let j = 0; j < line.length; j++) {
                  const c = line[j];
                  if (mode === 'block') { if (c === '*' && line[j + 1] === '/') { mode = null; j += 1; } continue; }
                  if (mode === 'tpl') {
                    if (c === '\\') { j += 1; continue; }
                    if (c === '`') { mode = null; continue; }
                    if (c === '$' && line[j + 1] === '{') { tplDepth.push(stack.length); stack.push([]); mode = null; j += 1; continue; }
                    continue;
                  }
                  if (c === '/' && line[j + 1] === '/') break;
                  if (c === '/' && line[j + 1] === '*') { mode = 'block'; j += 1; continue; }
                  if (c === '`') { mode = 'tpl'; continue; }
                  if (c === '"' || c === "'") {
                    let k = j + 1, v = '';
                    for (; k < line.length && line[k] !== c; k++) { if (line[k] === '\\') { v += line[k] + (line[k + 1] || ''); k += 1; } else v += line[k]; }
                    if (k >= line.length) return null;
                    j = k;
                    if (keyAfter(line, j + 1)) { rec.keys.push(v); pending.push(v); }
                    continue;
                  }
                  if (/[A-Za-z_$]/.test(c)) {
                    const m = line.slice(j).match(/^[A-Za-z_$][\w$-]*/)[0];
                    j += m.length - 1;
                    if (keyAfter(line, j + 1)) { rec.keys.push(m); pending.push(m); }
                    continue;
                  }
                  if (c === '{' || c === '[' || c === '(') { stack.push(pending); pending = []; continue; }
                  if (c === '}' || c === ']' || c === ')') {
                    if (!stack.length) return null;
                    stack.pop(); pending = [];
                    if (c === '}' && tplDepth.length && tplDepth[tplDepth.length - 1] === stack.length) { tplDepth.pop(); mode = 'tpl'; }
                    continue;
                  }
                  if (c === ',' || c === ';') pending = [];
                }
              }
              if (mode === 'block' || mode === 'tpl' || stack.length) return null;
              return out;
            };
            // The new text of a modified file: its default-branch text with the patch applied. null if the
            // patch does not fit the text.
            const applyPatch = (baseLines, P) => {
              const out = []; let o = 1;
              for (const x of P) {
                if (x.sign === '@' || x.sign === '\\') continue;
                if (x.sign === '+') { while (o < x.oldNo) out.push(baseLines[(o++) - 1]); out.push(x.body); continue; }
                while (o < x.oldNo) out.push(baseLines[(o++) - 1]);
                if (baseLines[x.oldNo - 1] !== x.body) return null;
                if (x.sign === ' ') out.push(x.body);
                o = x.oldNo + 1;
              }
              while (o <= baseLines.length) out.push(baseLines[(o++) - 1]);
              return out;
            };
            const reservedProblem = (P, baseText) => {
              const changed = P.filter((x) => x.sign === '+' || x.sign === '-');
              // A comment or blank line changes no data.
              const real = changed.filter((x) => !/^\s*(\/\/.*)?$/.test(x.body));
              for (const x of real) { const k = (keyContext(x.body) || [{ keys: [] }])[0].keys.find(reservedKey); if (k) return `names the reserved metadata key "${k}"`; }
              if (!real.length) return null;
              if (typeof baseText !== 'string') return 'could not be read on the default branch to check which block a changed line sits in';
              const oldL = baseText.split('\n');
              const newL = applyPatch(oldL, P);
              if (!newL) return 'does not match its text on the default branch; update the branch';
              const oc = keyContext(oldL.join('\n')), nc = keyContext(newL.join('\n'));
              if (!oc || !nc) return 'could not be read as data (unbalanced brackets or an unclosed string)';
              for (const x of real) {
                const rec = x.sign === '+' ? nc[x.newNo - 1] : oc[x.oldNo - 1];
                if (!rec) return 'could not be matched to its line';
                const k = [...rec.stack, ...rec.keys].find(reservedKey);
                if (k) return `changes a line inside or naming the reserved metadata key "${k}"`;
              }
              return null;
            };

            // Allowed files that are not linkOnly and not Markdown or text: every changed line must be a plain
            // data line (a key with a literal, a dotted name or an opening bracket, a literal list item, a
            // closing bracket, or a // comment), so no executable code can ride in through a data file.
            const STR = `"(?:[^"\\\\<\`]|\\\\(?:["\\\\/bfnrt]|u[0-9a-fA-F]{4}))*"|'(?:[^'\\\\<\`]|\\\\(?:['\\\\/bfnrt]|u[0-9a-fA-F]{4}))*'`;
            const LIT = `(?:${STR}|-?\\d+(?:\\.\\d+)?|true|false|null)`;
            const KEY = `(?:${STR}|[A-Za-z_$@][\\w$@-]*)`;
            const VAL = `(?:${LIT}|[A-Za-z_$][\\w$]*(?:\\.[A-Za-z_$][\\w$]*)*|\\[\\s*(?:${LIT}(?:\\s*,\\s*${LIT})*\\s*,?)?\\s*\\]|\\{\\s*\\}|\\[|\\{)`;
            const KV = `${KEY}\\s*:\\s*${LIT}`;
            const DATA_LINE = new RegExp(`^(?:|//(?!.*(?:/\\*|\\*/)).*|[\\]}]+[,;]?|${KEY}\\s*:\\s*${VAL}?\\s*,?|${LIT}\\s*,?|\\{\\s*(?:${KV}(?:\\s*,\\s*${KV})*\\s*,?)?\\s*\\}\\s*,?|\\{|\\[)$`);

            // A patch, line by line: sign, body, old and new line number, change block (a run of + and -
            // lines with no context line between) and hunk. null if a line is not a patch line.
            const parsePatch = (patch) => {
              const out = []; let o = 0, n = 0, block = -1, inBlock = false, hunk = -1;
              for (const raw of patch.split('\n')) {
                const h = raw.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (h) { o = Number(h[1]); n = Number(h[2]); hunk += 1; inBlock = false; out.push({ sign: '@', hunk }); continue; }
                if (raw.startsWith('\\')) { out.push({ sign: '\\', hunk }); continue; }
                const sign = raw[0];
                if (hunk < 0 || (sign !== ' ' && sign !== '+' && sign !== '-')) return null;
                if (sign === ' ') { inBlock = false; out.push({ sign, body: raw.slice(1), oldNo: o++, newNo: n++, hunk }); continue; }
                if (!inBlock) { block += 1; inBlock = true; }
                out.push({ sign, body: raw.slice(1), oldNo: sign === '-' ? o++ : o, newNo: sign === '+' ? n++ : n, block, hunk });
              }
              return out;
            };

            // linkOnly: a change passes only if it adds internal links and nothing else.
            // Link markup is stripped from removed and added lines, whitespace is collapsed,
            // and in each change block the removed and added lines must be equal as multisets. Only
            // internal links (a path starting with one "/", or a PostLink slug) are stripped, so an external
            // link, an extra attribute or changed link text is left in place and fails the match.
            const ATTR_OK = new Set(['href', 'slug', 'class', 'className']);
            // A link's class may only name plain classes, never ones that move, hide or layer it (an
            // overlay over the page) and never arbitrary [values].
            const classOk = (v) => v.split(/\s+/).filter(Boolean).every((t) => /^[a-z][a-z0-9-]*(?::[a-z][a-z0-9-]*)?$/.test(t)
              && !/^(?:fixed|absolute|sticky|relative|inset|z-|top-|bottom-|left-|right-|start-|end-|[wh]-|min-|max-|size-|scale|translate|rotate|skew|transform|hidden|invisible|visible|opacity|sr-only|not-sr-only|pointer-events|overflow|clip|contents|float|order|isolate|mix-|backdrop|filter|blur|bg-|before|after|content-)/.test(t.split(':').pop()));
            const internalHref = (h) => /^\/(?![\/\\])[^\s"'`<>\\]*$/.test(h);
            const tagLink = (m, tag, attrs, text) => {
              const found = [...attrs.matchAll(/\s+([A-Za-z]+)=(?:"([^"]*)"|'([^']*)'|\{\s*"([^"]*)"\s*\}|\{\s*'([^']*)'\s*\})/g)];
              if (found.map((a) => a[0]).join('') !== attrs) return m;
              let target = 0;
              for (const a of found) {
                const name = a[1], value = a[2] ?? a[3] ?? a[4] ?? a[5];
                if (!ATTR_OK.has(name)) return m;
                if ((name === 'class' || name === 'className') && !classOk(value)) return m;
                if (name === 'href') { if (!internalHref(value)) return m; target += 1; }
                if (name === 'slug') { if (tag !== 'PostLink' || !/^[a-z0-9-]+$/.test(value)) return m; target += 1; }
              }
              return target === 1 ? text : m;
            };
            const stripLinks = (line) => line
              .replace(/(?<!!)\[([^\][\n]*)\]\(([^()\s]+)\)/g, (m, text, url) => (internalHref(url) ? text : m))
              .replace(/<(a|Link|PostLink)((?:\s+[A-Za-z]+=(?:"[^"]*"|'[^']*'|\{\s*"[^"]*"\s*\}|\{\s*'[^']*'\s*\}))+)\s*>([^<>{}]*)<\/\1\s*>/g, tagLink);
            // lineOk: whole changed lines that a linkOnly file may change besides links, such as a meta
            // title or a heading. Entry: {files, allow, prev?, next?, deny?, pair?, frontmatter?}. A changed
            // line is accepted when it is at most LINE_OK_MAX characters, matches one allow pattern
            // (case-sensitive, anchored with ^ and $, no top-level |), matches no deny pattern (raw or folded,
            // case-insensitive), is plain ASCII on a health lane, and the lines just before and after it in
            // the same version of the file match prev and next when given (nearest first; a neighbour
            // outside the patch never matches). frontmatter: the line must sit inside the --- block at the
            // top of the file. pair (the default): in each change block, every allow pattern accepts as many
            // added lines as removed lines, so a line can be reworded in place but not added, deleted or
            // moved. pair false needs a prev check. A malformed entry holds every pull request.
            const LINE_OK_MAX = 300;
            const LINE_MAX = 2000;
            const HEALTH_OK = /^[\x20-\x7e\u2018\u2019\u201c\u201d\u2013\u00e9\u00b7]*$/;
            const LINE_OK_KEYS = new Set(['files', 'allow', 'prev', 'next', 'deny', 'pair', 'frontmatter']);
            const topAlt = (p) => {
              let d = 0, cls = false;
              for (let i = 0; i < p.length; i++) {
                const c = p[i];
                if (c === '\\') { i += 1; continue; }
                if (cls) { if (c === ']') cls = false; continue; }
                if (c === '[') cls = true; else if (c === '(') d += 1; else if (c === ')') d -= 1;
                else if (c === '|' && d === 0) return true;
                if (d < 0) return true;
              }
              return d !== 0;
            };
            const anchored = (p) => typeof p === 'string' && p.length > 1 && p.startsWith('^') && p.endsWith('$') && !p.endsWith('\\$') && !topAlt(p);
            const compileLineOk = (list) => {
              if (list === undefined) return [];
