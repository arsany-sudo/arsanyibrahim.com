name: SEO auto-merge

# Merges agent pull requests from fix/seo-* and blog/* branches once the Vercel
# build for the pull request passes AND every changed file is inside the rules in
# .github/seo-automerge.json (read from the default branch, never from the PR).
# This workflow never checks out or runs pull request code. Both triggers run the
# copy of this file on the default branch:
# - status: the Vercel commit status turns green.
# - pull_request_target: the pull request is opened, reopened or updated. This
#   covers the race where Vercel reports success before the pull request exists.
#   It only reads the commit statuses that are already there and goes on only if
#   every Vercel status for the head commit is already success.
# Never change this to plain pull_request: that would run the workflow file from
# the pull request branch with a write token.
# Anything outside the rules stays open with a comment that says why.

on:
  status:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: seo-automerge-${{ github.event.sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      (github.event_name == 'status' && github.event.state == 'success' && startsWith(github.event.context, 'Vercel')) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // BEGIN RULES LOGIC (pure functions; the test harness extracts and runs this block)
            // Third rework (2026-11-15): fix branches merge only a few whole-line shapes that are easy to
            // prove safe (a reworded title or description string, a reworded plain heading, a reworded alt
            // attribute, internal links added to Markdown sentences). Every other change holds for the owner.
            // Never auto-merged, whatever the rules file says. Matched without regard to case.
            const HARD_DENY = [
              '.github/**', '.claude/**', '**/.*', '**/.*/**', '.env*', '**/.env*',
              '**/package.json', '**/package-lock.json', '**/pnpm-lock.yaml', '**/pnpm-workspace.yaml', '**/yarn.lock', '**/bun.lock', '**/bun.lockb', '**/*.lock',
              '**/*.config.*', '**/tsconfig*.json', '**/vercel.json', '**/netlify.toml', '**/Dockerfile', '**/Makefile',
              '**/middleware.*', '**/proxy.*', '**/instrumentation*', '**/route.*', '**/robots.*', '**/_headers', '**/_redirects',
              '**/api/**', '**/actions/**', '**/actions.*', '**/*.server.*',
              'src/pages/**/*.ts', 'src/pages/**/*.js', 'src/pages/**/*.mts', 'src/pages/**/*.mjs',
              '**/*.html', '**/*.htm', '**/*.php', '**/*.sh', 'public/**/*.js', 'public/**/*.mjs', 'public/**/*.cjs',
              'supabase/**', 'prisma/**', 'drizzle/**', 'migrations/**', 'scripts/**',
              '**/*json-ld*', '**/*jsonld*',
            ];

            // Glob to regular expression. "**/" is zero or more folders, "**" anything,
            // "*" anything inside one folder. Every other character is literal.
            const toRe = (glob, flags = '') => {
              let re = '';
              for (let i = 0; i < glob.length;) {
                if (glob.startsWith('**/', i)) { re += '(?:.*/)?'; i += 3; }
                else if (glob.startsWith('**', i)) { re += '.*'; i += 2; }
                else if (glob[i] === '*') { re += '[^/]*'; i += 1; }
                else { re += glob[i].replace(/[.+?^${}()|[\]\\]/g, '\\$&'); i += 1; }
              }
              return new RegExp('^' + re + '$', flags);
            };
            // allow and newFiles are case-sensitive (narrow); deny and the rest are not (wide).
            const hit = (file, globs, flags = '') => (globs || []).some((g) => toRe(g, flags).test(file));
            const hitAnyCase = (file, globs) => hit(file, globs, 'i');

            // fold: a copy of a line with look-alike tricks undone, so every deny check sees the plain
            // letters: HTML entities, %xx and every backslash escape form (JS \u{..} \uXXXX \xXX, YAML
            // \UXXXXXXXX and named escapes, CSS \hex) are decoded, NFKD with combining marks removed,
            // invisible format characters removed, and common Cyrillic and Greek look-alikes mapped to Latin.
            // \u, \U and \x are case-sensitive, as every parser reads them. folds() also returns a copy with
            // octal escapes read (\74 is "<" in JS but "t" in CSS); deny checks test the raw line and both.
            const CONF_FROM = '\u0430\u0432\u0435\u043a\u043c\u043d\u043e\u0440\u0441\u0442\u0443\u0445\u0456\u0458\u0455\u0501\u04cf\u0261\u0578\u057d\u0410\u0412\u0415\u041a\u041c\u041d\u041e\u0420\u0421\u0422\u0423\u0425\u0406\u0408\u0405\u03b1\u03b2\u03b5\u03b7\u03b9\u03ba\u03bd\u03bf\u03c1\u03c4\u03c5\u03c7\u03c9\u0391\u0392\u0395\u0396\u0397\u0399\u039a\u039c\u039d\u039f\u03a1\u03a4\u03a5\u03a7\u0131\u2113';
            const CONF_TO = 'abekmhopctyxijsdlgnuABEKMHOPCTYXIJSabeniknoptuxwABEZHIKMNOPTYXil';
            const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', shy: '', zwj: '', zwnj: '', zwsp: '', ZeroWidthSpace: '', NoBreak: '', percnt: '%', dollar: '$', excl: '!', sol: '/', colon: ':', period: '.', hyphen: '-', dash: '-', num: '#', mdash: '\u2014', ndash: '\u2013', lpar: '(', rpar: ')', bsol: '\\', lsqb: '[', rsqb: ']', lcub: '{', rcub: '}', grave: '`', equals: '=' };
            const YAML_ESC = { N: '\u0085', _: '\u00a0', L: '\u2028', P: '\u2029', t: '\t', n: '\n', v: '\v', r: '\r' };
            const cp = (n) => (n >= 0 && n <= 0x10ffff ? String.fromCodePoint(n) : '');
            const decodeOnce = (s, octal) => {
              let t = s.replace(/&#x([0-9a-f]{1,6});?/gi, (m, h) => cp(parseInt(h, 16)))
                .replace(/&#(\d{1,7});?/g, (m, d) => cp(Number(d)))
                .replace(/&([A-Za-z]+);/g, (m, n) => (Object.prototype.hasOwnProperty.call(ENT, n) ? ENT[n] : m))
                .replace(/\\u\{([0-9a-fA-F]{1,6})\}/g, (m, h) => cp(parseInt(h, 16)))
                .replace(/\\U([0-9a-fA-F]{8})/g, (m, h) => cp(parseInt(h, 16)))
                .replace(/\\u([0-9a-fA-F]{4})/g, (m, h) => cp(parseInt(h, 16)))
                .replace(/\\x([0-9a-fA-F]{2})/g, (m, h) => cp(parseInt(h, 16)));
              if (octal) t = t.replace(/\\([0-7]{1,3})/g, (m, o) => cp(parseInt(o, 8)));
              return t.replace(/\\([0-9a-fA-F]{1,6}) ?/g, (m, h) => cp(parseInt(h, 16)))
                .replace(/\\([NLP_tnvr])/g, (m, c) => YAML_ESC[c])
                .replace(/%([0-9a-f]{2})/gi, (m, h) => cp(parseInt(h, 16)))
                .replace(/\\([^A-Za-z0-9])/g, '$1');
            };
            const foldWith = (s, octal) => {
              let t = s;
              for (let k = 0; k < 3; k++) t = decodeOnce(t, octal);
              t = t.normalize('NFKD').replace(/\p{M}/gu, '').replace(/[\p{Cf}\u034f\u115f\u1160\u3164\uffa0\u180e\u2800]/gu, '');
              let out = '';
              for (const ch of t) { const i = CONF_FROM.indexOf(ch); out += i < 0 ? ch : CONF_TO[i]; }
              return out;
            };
            const fold = (s) => foldWith(s, false);
            const folds = (s) => [foldWith(s, false), foldWith(s, true)];
            const squash = (s) => fold(s).toLowerCase().replace(/[^a-z0-9]/g, '');
            const anyRe = (res, line) => { const f = folds(line); return res.find((re) => re.test(line) || f.some((x) => re.test(x))); };

            // Elements matched in any letter case in Markdown; in code only when the tag starts with a
            // lowercase letter (a capitalised tag such as <Base> or <Link> is a component, not this element).
            const BAD_TAGS = new Set(['script', 'iframe', 'object', 'embed', 'frame', 'frameset', 'applet', 'portal', 'base', 'meta', 'link', 'style', 'form', 'input', 'button', 'textarea', 'select', 'svg', 'math', 'template', 'noscript']);
            // Built-in line checks. CODE: every changed line of a file that is not Markdown. MARKUP: every
            // changed line of a Markdown file. They hold code capability, outside resources and deindexing.
            const CODE = [
              /process\s*(\.|\[)|import\.meta|\bfetch\s*\(|XMLHttpRequest|sendBeacon|\bimport\s*\(|^\s*import\b|^\s*export\s*[*{]|\brequire\s*\(|\beval\s*\(|\bFunction\s*\(|setTimeout|setInterval|WebSocket|EventSource|postMessage|localStorage|sessionStorage|\bdocument\s*\.|\bwindow\s*\.|globalThis|navigator\s*\.|dangerouslySetInnerHTML|innerHTML|outerHTML|use server|child_process|\bexecSync\b|\bspawn\s*\(/i,
              { source: 'an HTML element that loads or runs something', test: (s) => [...s.matchAll(/<\s*\/?\s*([A-Za-z][\w-]*)/g)].some((m) => /^[a-z]/.test(m[1]) && BAD_TAGS.has(m[1].toLowerCase())) },
              /\son[a-z]+\s*=|(java|vb|live)script\s*:|\bdata\s*:\s*[a-z]+\/|\bsrcdoc\b|\bformaction\b|http-equiv/i,
              /redirect|\blocation\s*(\.|=)|\bnoindex\b|\bnofollow\b|\bnoarchive\b|\bnosnippet\b|\bnoimageindex\b|unavailable_after|x-robots-tag|\bdisallow\b|\bindex\s*:\s*false|\bfollow\s*:\s*false|\bgooglebot\b|\bcanonical\b|\brobots\s*[:=]/i,
            ];
            const MARKUP = [
              /<\s*\/?\s*(script|iframe|object|embed|frame|frameset|applet|portal|base|meta|link|style|form|input|button|textarea|select|svg|math|template|noscript)\b|\son[a-z]+\s*=|(java|vb|live)script\s*:|\bdata\s*:\s*[a-z]+\/|\bsrcdoc\b|<!--|^\s*import\s+([\w*{}\s,]+\s+from\s+)?["']|^\s*export\s+(const|let|var|function|default|class|async)\b/i,
            ];
            // URLs in a changed line, found by scheme with or without slashes, with backslashes read as
            // slashes (browsers do), userinfo and ports removed, and protocol-relative //host forms. Returns
            // the first problem, or null. http(s), ftp(s) and ws(s) need a host on the lane's hosts list;
            // mailto needs its domain there; schemes that load or run something (data, javascript, blob,
            // file...) and any other scheme://, hold. linkHttps: an https URL to any host is fine (a cited
            // source link in a post's frontmatter).
            const RISKY_SCHEME = /(?<![A-Za-z0-9+.-])(javascript|vbscript|livescript|data|blob|file|filesystem|view-source|intent|jar|about|sms|smsto|mms|webcal|gopher|ssh|sftp|smb|chrome|android-app|ios-app|ms-[a-z-]+):(?=[A-Za-z0-9\/%.,;+_~-])/i;
            const urlProblem = (line, hosts, linkHttps = false) => {
              for (const v of [line, ...folds(line)]) {
                const s = v.replace(/\\/g, '/');
                const r = s.match(RISKY_SCHEME);
                if (r) return `a ${r[1].toLowerCase()}: URL`;
                for (const m of s.matchAll(/(?<![A-Za-z0-9+.-])(https?|ftps?|wss?):(\/*)([^\/\s"'`<>()?#\[\]{}|,;]*)/gi)) {
                  const host = m[3].replace(/^.*@/, '').replace(/:\d*$/, '').toLowerCase();
                  if (linkHttps && m[1].toLowerCase() === 'https' && m[2] === '//' && host && !m[3].includes('@')) continue;
                  if (!host || !hosts.has(host)) return `a URL host not on this repo's hosts list (${(host || m[0]).slice(0, 60)})`;
                }
                for (const m of s.matchAll(/(?<![A-Za-z0-9+.-])([A-Za-z][A-Za-z0-9+.-]*):\/\//g)) {
                  if (!/^(https?|ftps?|wss?)$/i.test(m[1])) return `a ${m[1].slice(0, 20)}:// URL`;
                }
                for (const m of s.matchAll(/(?<![:\w])\/\/+([^\/\s"'`<>()?#\[\]{}|,;]+)/g)) {
                  const host = m[1].replace(/^.*@/, '').replace(/:\d*$/, '').toLowerCase();
                  if (!hosts.has(host)) return `a protocol-relative URL to a host not on this repo's hosts list (${host.slice(0, 60)})`;
                }
                for (const m of s.matchAll(/(?<![A-Za-z0-9+.-])mailto:([^\s"'`<>()?#]*)/gi)) {
                  const host = m[1].replace(/^.*@/, '').toLowerCase();
                  if (!m[1].includes('@') || !hosts.has(host)) return `a mailto: address outside this repo's hosts list`;
                }
              }
              return null;
            };

            // Protected paths (intake, start, booking, checkout and the lane's own list) are never linked.
            // Every link target in an added line is read the way a browser reads it: escapes and %xx
            // decoded, backslashes as slashes, an on-site host removed, duplicate slashes, "." and ".."
            // resolved. A target with any path segment on the list holds, so /./start and ../start hold too.
            const PROTECTED = ['start', 'lp', 'intake', 'quiz', 'checkout', 'cart', 'portal', 'login', 'account', 'booking', 'check-in', 'admin', 'api'];
            const LINK_RES = [/\]\(\s*<?([^\s)>]*)/g, /\bhref\s*=\s*\{?\s*["'`]([^"'`]*)/gi, /^\s*\[[^\]]*\]:\s*<?([^\s>]+)/g];
            const pathSegments = (target, hosts) => {
              let s = fold(target).replace(/\\/g, '/').trim();
              const sch = s.match(/^([A-Za-z][A-Za-z0-9+.-]*):(.*)$/);
              if (sch) { if (!/^https?$/i.test(sch[1])) return null; s = sch[2]; }
              const h = s.match(/^\/\/+([^\/?#]*)(.*)$/);
              if (h) {
                const host = h[1].replace(/^.*@/, '').replace(/:\d*$/, '').toLowerCase();
                if (!hosts.has(host)) return null;
                s = h[2];
              } else if (sch) return null;
              const segs = [];
              for (const g of s.replace(/[?#].*$/, '').split('/')) {
                if (g === '' || g === '.') continue;
                if (g === '..') { segs.pop(); continue; }
                segs.push(g.toLowerCase());
              }
              return segs;
            };
            const protectedLink = (line, prot, hosts) => {
              for (const re of LINK_RES) for (const m of line.matchAll(re)) {
                const segs = pathSegments(m[1], hosts);
                if (segs && segs.some((g) => prot.has(g))) return m[1];
              }
              return null;
            };

            // The new text of a modified file: its default-branch text with the patch applied. null if the
            // patch does not fit the text.
            const applyPatch = (baseLines, P) => {
              const out = []; let o = 1;
              for (const x of P) {
                if (x.sign === '@' || x.sign === '\\') continue;
                if (x.sign === '+') { while (o < x.oldNo) out.push(baseLines[(o++) - 1]); out.push(x.body); continue; }
                while (o < x.oldNo) out.push(baseLines[(o++) - 1]);
                if (baseLines[x.oldNo - 1] !== x.body) return null;
                if (x.sign === ' ') out.push(x.body);
                o = x.oldNo + 1;
              }
              while (o <= baseLines.length) out.push(baseLines[(o++) - 1]);
              return out;
            };

            // A patch, line by line: sign, body, old and new line number, change block (a run of + and -
            // lines with no context line between) and hunk. null if a line is not a patch line.
            const parsePatch = (patch) => {
              const out = []; let o = 0, n = 0, block = -1, inBlock = false, hunk = -1;
              for (const raw of patch.split('\n')) {
                const h = raw.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                if (h) { o = Number(h[1]); n = Number(h[2]); hunk += 1; inBlock = false; out.push({ sign: '@', hunk }); continue; }
                if (raw.startsWith('\\')) { out.push({ sign: '\\', hunk }); continue; }
                const sign = raw[0];
                if (hunk < 0 || (sign !== ' ' && sign !== '+' && sign !== '-')) return null;
                if (sign === ' ') { inBlock = false; out.push({ sign, body: raw.slice(1), oldNo: o++, newNo: n++, hunk }); continue; }
                if (!inBlock) { block += 1; inBlock = true; }
                out.push({ sign, body: raw.slice(1), oldNo: sign === '-' ? o++ : o, newNo: sign === '+' ? n++ : n, block, hunk });
              }
              return out;
            };

            // ---- Fix lane: the whole-line shapes that may merge.
            // The text of a reworded value: letters, digits, spaces and plain punctuation only (on a health
            // site printable ASCII only), no entity, no URL, and a length cap per kind.
            const TEXT_STD = /^[A-Za-z0-9 .,:;'&|()\/?\-\u2013\u00c0-\u00d6\u00d8-\u00f6\u00f8-\u017f]*$/;
            const TEXT_HEALTH = /^[A-Za-z0-9 .,:;'&|()\/?\-]*$/;
            const TEXT_MAX = { title: 120, seoTitle: 120, h1: 120, heading: 120, description: 320, alt: 200 };
            // Health sites: an added value with a price, offer, percentage, dose, drug or injectable brand
            // name or claim word holds (after folding; brand names also with spaces and punctuation removed).
            const HEALTH_WORDS = /\b(price[sd]?|pricing|costs?|cheap\w*|affordable|discount\w*|deals?|sale|coupons?|promo\w*|savings?|save|bargain|lowest|free|off|offers?|percent|per cent|dollars?|guarantee\w*|cures?|cured|curing|heal(s|ed|ing)?|proven|clinical(ly)?|miracle|breakthrough|permanent(ly)?|risk[- ]?free|painless|side[- ]?effects?|results?|safe|safely|safest|best|number one|mg|mcg|milligrams?|micrograms?|ml|iu|units?|doses?|dosing|dosage|lbs?|pounds?|kg)\b|#1|[$%\u00a2\u00a3\u20ac\u00a5]|\d\s*(mg|mcg|ml|lb|kg)/i;
            const HEALTH_BRANDS = ['ozempic', 'wegovy', 'mounjaro', 'zepbound', 'rybelsus', 'saxenda', 'trulicity', 'victoza', 'botox', 'dysport', 'xeomin', 'jeuveau', 'daxxify', 'juvederm', 'restylane', 'sculptra', 'kybella', 'coolsculpting', 'emsculpt'];
            const textProblem = (v, kind, health) => {
              if (v.length > TEXT_MAX[kind]) return `is longer than ${TEXT_MAX[kind]} characters`;
              if (kind !== 'alt' && !v.trim()) return 'is empty';
              if (!(health ? TEXT_HEALTH : TEXT_STD).test(v)) return 'uses a character outside letters, digits, spaces and plain punctuation';
              if (/&[#A-Za-z0-9]+;/.test(v)) return 'contains an HTML entity';
              if (/:\/\/|\bwww\./i.test(v)) return 'contains a web address';
              if (health) {
                const f = fold(v);
                const w = f.match(HEALTH_WORDS);
                if (w) return `contains "${w[0]}", a price, offer, dose or claim word, which never merges on its own on a health site`;
                const b = HEALTH_BRANDS.find((x) => squash(v).includes(x));
                if (b) return `names ${b}, which never merges on its own on a health site`;
              }
              return null;
            };

            // Parents a title or description key may sit in, read by indentation from the unchanged lines
            // above it (nearest first). Built in for .tsx and .jsx: Next.js `export const metadata`, and its
            // openGraph or twitter block. A lane's metaObjects adds chains for named files.
            const META_OPEN = '^export const metadata(?:\\s*:\\s*Metadata)?\\s*=\\s*(?:[A-Za-z_$][\\w$]*\\()?\\{$';
            const META_CHAINS = [[META_OPEN], ['^\\s+(?:openGraph|twitter):\\s*\\{$', META_OPEN]];
            const SHAPE_EXT = /\.(md|mdx|astro|tsx|jsx)$/i;
            const IMG_TAGS = 'img|Image|Picture|Media|ShoeImage|ProductImage';
            const ALT_LINE = new RegExp(`^(\\s*<(?:${IMG_TAGS})(?:\\s+[A-Za-z_:][\\w:.-]*(?:="[^"]*"|=\\{[A-Za-z_$][\\w$.]*\\})?)*\\s+alt=")([^"]*)(".*)$`);
            const HEADING_EL = /^(\s*<h([1-6])(?:\s[^<>]*)?>)([^<>{}]*)(<\/h\2>\s*)$/;
            const FM_LINE = /^(title|seoTitle|description|h1):( +)(?:"([^"\\]*)"|'([^'\\]*)'|([A-Za-z0-9\u00c0-\u017f][^"'#\\]*?))(\s*)$/;
            const TS_KEY = /^( +)(title|description|seoTitle|h1):( ?)(?:"([^"\\]*)"|'([^'\\]*)')(,?\s*)$/;
            const TS_VALUE = /^( +)(?:"([^"\\]*)"|'([^'\\]*)')(,?\s*)$/;
            const TS_KEY_ALONE = /^( +)(title|description|seoTitle|h1):\s*$/;
            const ASTRO_CONST = /^const (title|description|seoTitle|h1) = (?:"([^"\\]*)"|'([^'\\]*)')(;?\s*)$/;
            const BASE_ATTR = /^\s+([A-Za-z][\w-]*)="([^"]*)"/;
            const baseTag = (line) => {
              const m = line.match(/^\s*<Base(?=\s)/);
              if (!m) return null;
              let i = m[0].length; const attrs = [];
              for (;;) { const a = line.slice(i).match(BASE_ATTR); if (!a) break; attrs.push([a[1], a[2]]); i += a[0].length; }
              return { head: m[0], attrs, rest: line.slice(i) };
            };
            // Markdown: the line with every internal link that passes reduced to its text. An internal link
            // is a path on this site starting with one "/", no dot segments, %, backslash or protected path.
            const internalOk = (t, prot) => /^\/(?![\/])[A-Za-z0-9\-_~.\/]*(?:#[A-Za-z0-9\-_]*)?$/.test(t) && !/\/\//.test(t)
              && !t.split('#')[0].split('/').some((g) => g === '.' || g === '..' || prot.has(g.toLowerCase()));
            const mdText = (line, prot) => line.replace(/(?<!!)\[([^\][\n]*)\]\(([^()\s]*)\)/g, (m, text, url) => (internalOk(url, prot) ? text : m));

            // Checks a fix-lane patch of one page or post file. Returns the first problem or null.
            // opt: {health, baseLines, chains (extra metaObjects chains for this file), prot (Set), code (true
            // for .ts files named in metaObjects)}.
            const shapeProblem = (P, name, opt = {}) => {
              if (typeof P === 'string') P = parsePatch(P);
              if (!P) return 'has a diff that cannot be read line by line';
              const health = opt.health === true, prot = opt.prot || new Set(PROTECTED);
              const ext = (name.match(/\.([A-Za-z]+)$/) || [])[1].toLowerCase();
              const md = ext === 'md' || ext === 'mdx', astro = ext === 'astro', jsx = ext === 'tsx' || ext === 'jsx' || ext === 'ts';
              // Both versions of the file by line number: whole files when the default-branch text is known,
              // else only the lines the patch shows (a check that needs a line it cannot see holds).
              const oldL = new Map(), newL = new Map();
              if (opt.baseLines) {
                const full = applyPatch(opt.baseLines, P);
                if (!full) return 'does not match its text on the default branch; update the branch';
                opt.baseLines.forEach((l, k) => oldL.set(k + 1, l)); full.forEach((l, k) => newL.set(k + 1, l));
              } else for (const x of P) { if (x.sign === ' ' || x.sign === '-') oldL.set(x.oldNo, x.body); if (x.sign === ' ' || x.sign === '+') newL.set(x.newNo, x.body); }
              // Is line no inside the --- block at the top of the file?
              const inTop = (L, no) => {
